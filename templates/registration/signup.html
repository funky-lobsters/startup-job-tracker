{% extends "base.html" %}

{% block title %}Sign up · Funky Lobsters{% endblock %}

{% block content %}
  <article>
    <h1>Create an account</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_div }}
      <button type="submit">Sign up</button>
    </form>
    <p>Already have an account? <a href="{% url 'login' %}">Log in</a></p>
  </article>
{% endblock %}
